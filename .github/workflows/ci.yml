name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Essential Governance Files
        run: |
          for f in README.md LICENSE CONTRIBUTING.md SECURITY.md ROADMAP.md bom-sourcing/SKILL.md bom-sourcing/README.md; do
            test -f "$f" || (echo "Missing $f" && exit 1)
          done

      - name: Validate Skill Frontmatter
        run: |
          python3 -c '
          text = open("bom-sourcing/SKILL.md", encoding="utf-8").read()
          assert text.startswith("---\n"), "Missing YAML frontmatter start"
          parts = text.split("---\n", 2)
          assert len(parts) == 3, "Malformed YAML frontmatter"
          frontmatter = parts[1]
          assert "name: bom-sourcing" in frontmatter, "Missing name: bom-sourcing"
          assert "description:" in frontmatter, "Missing description key"
          print("Skill frontmatter verified.")
          '

      - name: Run Anti-AI-Slop Linter
        run: |
          FORBIDDEN="seamlessly|blazingly fast|cutting-edge|revolutionary|comprehensive and robust|effortlessly"
          for f in README.md bom-sourcing/README.md CONTRIBUTING.md SECURITY.md ROADMAP.md; do
            if grep -E -i "$FORBIDDEN" "$f"; then
              echo "::error file=$f::Forbidden marketing buzzwords found in documentation"
              exit 1
            fi
            if grep -q "—" "$f"; then
              echo "::error file=$f::Forbidden em-dash detected"
              exit 1
            fi
          done

      - name: Validate Internal Documentation Links
        run: |
          python3 -c '
          import re, glob, os, sys

          def check_file(f):
              content = open(f, encoding="utf-8").read()
              content = re.sub(r"```[\s\S]*?```", "", content)
              content = re.sub(r"`[^`]*`", "", content)
              links = re.findall(r"\[.*?\]\((?!https?://|mailto:)(.*?)(?:#.*)?\)", content)
              broken = []
              for link in links:
                  link = link.strip().split("?")[0]
                  if not link or link.startswith("#"):
                      continue
                  target = os.path.normpath(os.path.join(os.path.dirname(f), link))
                  if not os.path.exists(target):
                      broken.append(f"{f} -> {link} (resolved: {target})")
              return broken

          all_broken = []
          for f in glob.glob("**/*.md", recursive=True):
              all_broken.extend(check_file(f))

          if all_broken:
              print("Error: Broken internal documentation links detected:", file=sys.stderr)
              for b in all_broken:
                  print("  -", b, file=sys.stderr)
              sys.exit(1)
          print("Internal documentation links verified.")
          '
