<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 712" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workflow-architecture-title workflow-architecture-desc" id="workflow-architecture-root">
        <title id="workflow-architecture-title">BOM Sourcing Workflow Architecture</title>
        <desc id="workflow-architecture-desc">Flowchart separating offline BOM extraction and normalization from optional live catalog sourcing via robo-market-search before delivering the BOM table and JSON.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #workflow-architecture-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #workflow-architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #workflow-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#workflow-architecture-root .diagram-container { overflow-x: visible; }
}</style>
          <pattern id="workflow-architecture-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
          </pattern>
          <marker id="workflow-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="workflow-architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="workflow-architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#workflow-architecture-dots)" opacity="0.55"/>

        <!-- Arrows (drawn first, behind nodes) -->
        <!-- Start -> Step 1 -->
        <line x1="280" y1="76" x2="280" y2="108" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#workflow-architecture-arrow)"/>
        <!-- Step 1 -> Step 2 -->
        <line x1="280" y1="156" x2="280" y2="188" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#workflow-architecture-arrow)"/>
        <!-- Step 2 -> Normalize -->
        <line x1="280" y1="236" x2="280" y2="268" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#workflow-architecture-arrow)"/>
        <!-- Normalize -> Decision -->
        <line x1="280" y1="316" x2="280" y2="356" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#workflow-architecture-arrow)"/>
        <!-- Decision -> Deliver (No / Offline) -->
        <line x1="280" y1="452" x2="280" y2="560" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#workflow-architecture-arrow)"/>
        <!-- Decision -> Query robo-market-search (Yes / Live) -->
        <line x1="400" y1="404" x2="560" y2="404" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#workflow-architecture-arrow-link)"/>
        <!-- Query -> Verify -->
        <line x1="700" y1="428" x2="700" y2="468" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#workflow-architecture-arrow-link)"/>
        <!-- Verify -> Compare -->
        <line x1="700" y1="516" x2="700" y2="560" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#workflow-architecture-arrow-link)"/>
        <!-- Compare -> Deliver -->
        <line x1="560" y1="584" x2="420" y2="584" stroke="#bf4520" stroke-width="1.4" marker-end="url(#workflow-architecture-arrow-accent)"/>

        <!-- Arrow labels (with opaque paper masks, 8-10px off stroke) -->
        <rect x="440" y="382" width="80" height="14" rx="2" fill="#f5f5f5"/>
        <text x="480" y="392" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES (LIVE)</text>

        <rect x="290" y="498" width="96" height="14" rx="2" fill="#f5f5f5"/>
        <text x="338" y="508" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO (OFFLINE)</text>

        <!-- Start oval -->
        <rect x="160" y="32" width="240" height="44" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="280" y="58" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Project Repository</text>

        <!-- Step 1 -->
        <rect x="140" y="108" width="280" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="280" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">1. Choose Scope</text>
        <text x="280" y="144" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">repo · subsystem · target directory</text>

        <!-- Step 2 -->
        <rect x="140" y="188" width="280" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="280" y="208" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">2. Discover Project Evidence</text>
        <text x="280" y="224" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">schematics · firmware · docs · CAD</text>

        <!-- Normalize -->
        <rect x="140" y="268" width="280" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="280" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Normalize &amp; Infer Missing Items</text>
        <text x="280" y="304" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MPN · quantity · power · connectors</text>

        <!-- Decision Diamond (focal 1) -->
        <polygon points="280,356 400,404 280,452 160,404" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="280" y="400" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Live Sourcing</text>
        <text x="280" y="416" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Requested?</text>

        <!-- Step 3 (Live) -->
        <rect x="560" y="380" width="280" height="48" rx="6" fill="#ffffff" stroke="#2e5aa8" stroke-width="1"/>
        <text x="700" y="400" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">3. Query robo-market-search</text>
        <text x="700" y="416" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">live catalog · pricing · availability</text>

        <!-- Verify -->
        <rect x="560" y="468" width="280" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="700" y="488" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Verify Specs, Stock &amp; Shipping</text>
        <text x="700" y="504" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">destination · currency · lead time</text>

        <!-- Compare -->
        <rect x="560" y="560" width="280" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="700" y="580" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Compare Single vs Split Carts</text>
        <text x="700" y="596" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">landed cost · store consolidation</text>

        <!-- End oval (focal 2) -->
        <rect x="140" y="560" width="280" height="48" rx="20" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="280" y="580" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">4. Deliver BOM Table &amp; JSON</text>
        <text x="280" y="596" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">offline or live-priced · schema-validated</text>

        <!-- Legend -->
        <line x1="40" y1="648" x2="960" y2="648" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <text x="40" y="664" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

        <rect x="40" y="680" width="24" height="12" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="72" y="690" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start / end (oval)</text>

        <rect x="212" y="680" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="244" y="690" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step (rectangle)</text>

        <polygon points="384,686 396,680 408,686 396,692" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="416" y="690" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision (diamond)</text>

        <line x1="564" y1="686" x2="592" y2="686" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#workflow-architecture-arrow-link)"/>
        <text x="600" y="690" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Live catalog query</text>

        <line x1="744" y1="686" x2="772" y2="686" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#workflow-architecture-arrow)"/>
        <text x="780" y="690" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Offline flow</text>
      </svg>
